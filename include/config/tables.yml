# DLT Postgres Copy Table Configuration
#
# Consumed by create_postgres_copy_task_group() at DAG parse time.
# Each connection key produces a TaskGroup with one task per table entry.
#
# Structure:
#   <airflow_connection_name>:        # Airflow connection ID for the source PostgreSQL database
#     - table: <table_name>           # Source (and destination) table name
#       incremental_key: <col>        # Optional. Enables incremental load (dlt delete+insert merge).
#                                     # Must be a timestamp/datetime column. Omit for full refresh.
#                                     # The load window is controlled by Airflow's data_interval_start
#                                     # and data_interval_end — dlt defers to the Airflow scheduler.
#       primary_key: <col>            # Optional. Used for merge deduplication. Defaults to 'id'.
#       exclude_columns:              # Optional. Columns to omit from the copy.
#         - <column_name>
#
# Notes:
#   - Tables with `incremental_key` load rows where:
#       incremental_key >= data_interval_start AND incremental_key < data_interval_end
#     Pass full_refresh=True to create_postgres_copy_task_group() to override for a one-off reload.
#   - Tables without `incremental_key` perform a full replace on every run.
#   - The destination table name always matches the source table name.
#   - JSONB columns are automatically detected and preserved as JSONB in the destination.
#   - On success, each task emits a Dataset event:
#       postgres://<target_conn_id>/<dataset_name>/<table_name>

source_postgres_conn:
  - table: orders
    incremental_key: updated_at
    primary_key: id
    exclude_columns:
      - internal_notes

  - table: customers
    incremental_key: updated_at
    primary_key: id

  - table: products
    incremental_key: updated_at
    primary_key: id
    exclude_columns:
      - cost_price
      - supplier_id

  # Full refresh table (no incremental_key) — replaced on every run
  - table: daily_store_metrics

another_source_conn:
  - table: events
    incremental_key: created_at
    primary_key: event_id
